name: Validate compressed Codex history

on:
  push:
    branches: [ci/codex-zstd-cost-history]
  workflow_dispatch:

permissions:
  contents: read

env:
  FIX_COMMIT: bf0e62e87d61c0ca2ef1b235d26bc22996db1bcf

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Repository checks
        run: make check

  tests:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode and verify decoder
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
          swift --version
          command -v zstd || brew install zstd
      - name: Focused core regression tests
        id: core
        continue-on-error: true
        run: |
          source ./Scripts/test_environment.sh
          export CODEXBAR_DISABLE_KEYCHAIN_ACCESS=1
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil

          source = Path.cwd()
          harness = Path(os.environ["RUNNER_TEMP"]) / "codex-zstd-validation"
          tests = harness / "Tests"
          tests.mkdir(parents=True)
          for name in [
              "CostUsageCodexZstdTests.swift",
              "CostUsageCodexZstdTests+Budgets.swift",
              "CostUsageJsonlScannerTests.swift",
              "CostUsageScannerTests.swift",
              "CostUsageStoreTests.swift",
              "CostUsageTestFactory.swift",
              "CostUsageClaudeCacheTestSupport.swift",
              "LockIsolated.swift",
              "DirectoryMetadataScanBudgetTests.swift",
          ]:
              shutil.copyfile(source / "Tests/CodexBarTests" / name, tests / name)
          manifest = """// swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "CompressedHistoryValidation",
              platforms: [.macOS(.v14)],
              dependencies: [.package(path: SOURCE)],
              targets: [.testTarget(
                  name: "CompressedHistoryValidationTests",
                  dependencies: [.product(name: "CodexBarCore", package: "CodexBar")],
                  path: "Tests")])
          """.replace("SOURCE", json.dumps(str(source)))
          (harness / "Package.swift").write_text(manifest)
          PYTHON
          swift test --package-path "$RUNNER_TEMP/codex-zstd-validation" --parallel
      - name: Build the production cost command
        run: swift build --product CodexBarCLI --scratch-path "$RUNNER_TEMP/codex-zstd-validation/.build"
      - name: Verify released CLI and exercise synthetic production behavior
        run: |
          mkdir -p "$RUNNER_TEMP/codexbar-stable"
          case "$(uname -m)" in
            arm64)
              proof_arch=arm64
              proof_sha=5e6d922fbebbd41a748bc906500740529265e65afbc7ffd2ce8c8794fc5edf76
              ;;
            x86_64)
              proof_arch=x86_64
              proof_sha=aca88b9b916197e5e0dba33c0e2a8e78f27d4a40760acf849509060b630cea0c
              ;;
          esac
          curl --fail --location --silent --show-error \
            "https://github.com/steipete/CodexBar/releases/download/v0.82.0/CodexBarCLI-v0.82.0-macos-$proof_arch.tar.gz" \
            --output "$RUNNER_TEMP/codexbar-stable/cli.tar.gz"
          printf '%s  %s\n' "$proof_sha" "$RUNNER_TEMP/codexbar-stable/cli.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/codexbar-stable/cli.tar.gz" -C "$RUNNER_TEMP/codexbar-stable"
          proof_bin=$(swift build --show-bin-path --scratch-path "$RUNNER_TEMP/codex-zstd-validation/.build")
          python3 .github/pr-proof/codex-zstd-history/run-proof.py \
            --base "$RUNNER_TEMP/codexbar-stable/codexbar" \
            --head "$proof_bin/CodexBarCLI" --large
      - name: Require focused regressions to pass
        if: steps.core.outcome != 'success'
        run: exit 1

  regression-before:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode and fetch the pre-review implementation
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
          git fetch --depth=1 origin a186d28262bfa8f72c1c30d72113cc999f19b200
          mkdir -p "$RUNNER_TEMP/codex-zstd-baseline"
          git worktree add --detach "$RUNNER_TEMP/codex-zstd-baseline/CodexBar" a186d28262bfa8f72c1c30d72113cc999f19b200
      - name: Reproduce double counting with the same paged transition regression
        run: |
          source ./Scripts/test_environment.sh
          export CODEXBAR_DISABLE_KEYCHAIN_ACCESS=1
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import re
          import shutil

          source = Path.cwd()
          root = Path(os.environ["RUNNER_TEMP"]) / "codex-zstd-baseline"
          harness = root / "TestHarness"
          tests = harness / "Tests"
          tests.mkdir(parents=True)
          main = (source / "Tests/CodexBarTests/CostUsageCodexZstdTests.swift").read_text()
          budget = (source / "Tests/CodexBarTests/CostUsageCodexZstdTests+Budgets.swift").read_text()
          start = budget.index('    @Test\n    func `paged compression transitions')
          method = budget[start:budget.index('\n    @Test', start + 10)]
          method = re.sub(r'(?ms)^        func progressDetails\(\) -> String \{.*?^        \}\n', '', method)
          method = method.replace(r'#expect(completed, "\(progressDetails())")', '#expect(completed)')
          helpers = []
          for first, last in [
              ('    func day(', '\n    func options('),
              ('    func options(', '\n    func report('),
              ('    func report(', '\n    func withContext'),
              ('    var contents:', '\n    var archive:'),
              ('    var archive:', '\n    private var replacementArchive:'),
          ]:
              begin = main.index(first)
              helpers.append(main[begin:main.index(last, begin)])
          header = 'import Foundation\nimport Testing\n@testable import CodexBarCore\n'
          (tests / 'PagedTransition.swift').write_text(
              header + 'struct PagedTransitionRegressionTests {\n' + method + '\n'.join(helpers) + '\n}\n')
          environment = (source / 'Tests/CodexBarTests/CostUsageScannerTests.swift').read_text()
          (tests / 'Environment.swift').write_text(
              header + '#if canImport(Darwin)\nimport Darwin\n#else\nimport Glibc\n#endif\n' +
              environment[environment.index('struct CostUsageTestEnvironment {'):])
          for name in ['CostUsageTestFactory.swift', 'CostUsageClaudeCacheTestSupport.swift', 'LockIsolated.swift']:
              shutil.copyfile(source / 'Tests/CodexBarTests' / name, tests / name)
          manifest = '''// swift-tools-version: 6.2
          import PackageDescription
          let package = Package(name: "PagedTransitionRegression", platforms: [.macOS(.v14)],
              dependencies: [.package(path: SOURCE)],
              targets: [.testTarget(name: "PagedTransitionRegressionTests",
                  dependencies: [.product(name: "CodexBarCore", package: "CodexBar")], path: "Tests")])
          '''.replace('SOURCE', json.dumps(str(root / 'CodexBar')))
          (harness / 'Package.swift').write_text(manifest)
          PYTHON
          set +e
          swift test --package-path "$RUNNER_TEMP/codex-zstd-baseline/TestHarness" --parallel > "$RUNNER_TEMP/zstd-before.log" 2>&1
          proof_before_status=$?
          set -e
          test "$proof_before_status" -ne 0
          python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import re
          log = (Path(os.environ['RUNNER_TEMP']) / 'zstd-before.log').read_text()
          log = re.sub(r'\x1b\[[0-?]*[ -/]*[@-~]', '', log)
          failures = [line for line in log.splitlines() if 'Expectation failed' in line]
          assert any('1100' in line for line in failures) and '→ 2200' in log, log[-12000:]
          print('CONFIRMED: the pre-review implementation counts 2,200 tokens for a 1,100-token session during paged discovery.')
          print('\n'.join(line for line in log.splitlines() if 'Expectation failed' in line or '→ 2200' in line))
          PYTHON
