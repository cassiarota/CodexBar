name: Validate compressed Codex history

on:
  push:
    branches: [ci/codex-zstd-cost-history]
  workflow_dispatch:

permissions:
  contents: read

env:
  FIX_COMMIT: eb806485d8f639615a661eeac93c71db2de4b86e

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Repository checks
        run: make check

  tests:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode and verify decoder
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
          swift --version
          command -v zstd || brew install zstd
      - name: Focused core regression tests
        run: |
          source ./Scripts/test_environment.sh
          export CODEXBAR_DISABLE_KEYCHAIN_ACCESS=1
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path
          import shutil

          source = Path.cwd()
          harness = Path(os.environ["RUNNER_TEMP"]) / "codex-zstd-validation"
          tests = harness / "Tests"
          tests.mkdir(parents=True)
          for name in [
              "CostUsageCodexZstdTests.swift",
              "CostUsageCodexZstdTests+Budgets.swift",
              "CostUsageJsonlScannerTests.swift",
              "CostUsageScannerTests.swift",
              "CostUsageStoreTests.swift",
              "CostUsageTestFactory.swift",
              "CostUsageClaudeCacheTestSupport.swift",
              "LockIsolated.swift",
              "DirectoryMetadataScanBudgetTests.swift",
          ]:
              shutil.copyfile(source / "Tests/CodexBarTests" / name, tests / name)
          manifest = """// swift-tools-version: 6.2
          import PackageDescription
          let package = Package(
              name: "CompressedHistoryValidation",
              platforms: [.macOS(.v14)],
              dependencies: [.package(path: SOURCE)],
              targets: [.testTarget(
                  name: "CompressedHistoryValidationTests",
                  dependencies: [.product(name: "CodexBarCore", package: "CodexBar")],
                  path: "Tests")])
          """.replace("SOURCE", json.dumps(str(source)))
          (harness / "Package.swift").write_text(manifest)
          PYTHON
          swift test --package-path "$RUNNER_TEMP/codex-zstd-validation" --parallel
      - name: Build the production cost command
        run: swift build --product CodexBarCLI --scratch-path "$RUNNER_TEMP/codex-zstd-validation/.build"
      - name: Verify released CLI and exercise synthetic production behavior
        run: |
          mkdir -p "$RUNNER_TEMP/codexbar-stable"
          case "$(uname -m)" in
            arm64)
              proof_arch=arm64
              proof_sha=5e6d922fbebbd41a748bc906500740529265e65afbc7ffd2ce8c8794fc5edf76
              ;;
            x86_64)
              proof_arch=x86_64
              proof_sha=aca88b9b916197e5e0dba33c0e2a8e78f27d4a40760acf849509060b630cea0c
              ;;
          esac
          curl --fail --location --silent --show-error \
            "https://github.com/steipete/CodexBar/releases/download/v0.82.0/CodexBarCLI-v0.82.0-macos-$proof_arch.tar.gz" \
            --output "$RUNNER_TEMP/codexbar-stable/cli.tar.gz"
          printf '%s  %s\n' "$proof_sha" "$RUNNER_TEMP/codexbar-stable/cli.tar.gz" | shasum -a 256 -c -
          tar -xzf "$RUNNER_TEMP/codexbar-stable/cli.tar.gz" -C "$RUNNER_TEMP/codexbar-stable"
          proof_bin=$(swift build --show-bin-path --scratch-path "$RUNNER_TEMP/codex-zstd-validation/.build")
          python3 .github/pr-proof/codex-zstd-history/run-proof.py \
            --base "$RUNNER_TEMP/codexbar-stable/codexbar" \
            --head "$proof_bin/CodexBarCLI" --large
