name: Build local Sol pricing fix

on:
  push:
    branches: [build/gpt61-sol-fast-pricing]
  workflow_dispatch:

permissions:
  contents: read

env:
  FIX_COMMIT: 8a3352ab5feee2c1ed2f511c086d43e3826652f1

jobs:
  check:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
      - name: Repository checks
        run: make check

  tests:
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.FIX_COMMIT }}
          persist-credentials: false
      - name: Select Xcode 27
        run: |
          sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer
          echo 'DEVELOPER_DIR=/Applications/Xcode_27.0.app/Contents/Developer' >> "$GITHUB_ENV"
          swift --version
      - name: Build test targets before entering the isolated runtime home
        run: |
          source ./Scripts/test_environment.sh
          swift build --build-tests
      - name: Focused pricing and session tier regression tests
        run: >-
          make test-skip-build
          FILTER='CostUsage(SolFastPricing|Pricing|AstraPricing|CodexSessionTier|ScannerCodexPriority|CodexSourceRecovery|RequestLedgerMigration|Store)Tests'
